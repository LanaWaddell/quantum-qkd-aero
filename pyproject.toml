[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-qkd-aero"
version = "0.2.0"
description = "A verified quantum-link simulator for QKD and teleportation over satellite free-space and optical fibre channels."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Lana Waddell" },
]
keywords = [
    "quantum-key-distribution",
    "qkd",
    "bb84",
    "decoy-state",
    "quantum-teleportation",
    "satellite-communications",
    "quantum-networking",
    "simulation",
]
dependencies = [
    "numpy",
    "matplotlib",
]

[project.urls]
Repository = "https://github.com/LanaWaddell/quantum-qkd-aero"

[project.optional-dependencies]
dev = [
    "pytest",
]
qiskit = [
    "qiskit",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
